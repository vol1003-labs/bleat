[package]
name = "bleat"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Mail-style messaging CLI for coordinating coding agents"
repository = "https://github.com/vol1003-labs/bleat"
readme = "README.md"
keywords = ["cli", "agents", "messaging", "mail", "coordination"]
categories = ["command-line-utilities", "development-tools"]
include = ["Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "src/**", "tests/**"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.30", features = ["process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.dist]
inherits = "release"
lto = "thin"
